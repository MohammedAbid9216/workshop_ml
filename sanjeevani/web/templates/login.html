<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | Sanjeevani Clinic</title>
<link rel="stylesheet" href="/static/dashboard.css">
</head>
<body class="login">
<form id="loginForm">
  <h1>Sanjeevani Clinic</h1>
  <p>Sign in to your account</p>
  <input id="email" type="email" placeholder="Email address" autocomplete="email" required>
  <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
  <button id="submitButton" type="submit">Sign in</button>
  <div id="error" role="alert"></div>
  <p>Don't have an account? <a href="/register">Create account</a></p>
</form>
<script>
const loginForm = document.getElementById("loginForm");
loginForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  const error = document.getElementById("error");
  const button = document.getElementById("submitButton");
  error.textContent = "";
  button.disabled = true;

  try {
    const response = await fetch("/auth/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || "Login failed");

    localStorage.setItem("token", data.access_token);
    localStorage.setItem("role", data.role);
    localStorage.setItem("name", data.name);

    const next = new URLSearchParams(location.search).get("next");
    location.href = next && next.startsWith("/") && !next.startsWith("//")
      ? next : "/dashboard";
  } catch (err) {
    error.textContent = err.message || "Unable to sign in";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
